<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | CAMUS</title><link rel="stylesheet" href="style.css"></head><body><main class="site-shell"><header class="site-header"><a class="brand" href="index.html"><img src="logo.svg" alt="CAMUS"><span>CAMUS</span></a><nav class="main-nav"><a href="index.html">Discover</a><a href="menu.html">Dishes</a><a class="active" href="checkout.html">Checkout</a><a href="account.html">Account</a></nav><a class="login-button" href="login.html">Log in</a></header><section class="page-hero"><span class="eyebrow">Almost there</span><h1>Complete your<br><em>order.</em></h1><p>Choose pickup or delivery, add your details, and send the order to the restaurant.</p></section><section class="page-content"><div class="checkout-layout"><form class="form-shell" id="checkoutForm"><h2>Order details</h2><div class="form-group"><label>Fulfilment</label><div class="choice-row"><label><input type="radio" name="orderType" value="pickup" checked> Pickup</label><label><input type="radio" name="orderType" value="delivery"> Delivery</label></div></div><div class="form-grid"><div class="form-group"><label for="customerName">Full name</label><input id="customerName" required></div><div class="form-group"><label for="customerPhone">Phone number</label><input id="customerPhone" type="tel" required></div><div class="form-group"><label for="deliveryCity">City</label><input id="deliveryCity" value="Yaoundé" required></div><div class="form-group"><label for="deliveryNeighborhood">Neighborhood</label><input id="deliveryNeighborhood" required></div><div class="form-group full"><label for="deliveryAddress">Address</label><input id="deliveryAddress" required></div><div class="form-group full"><label for="customerNote">Order notes</label><textarea id="customerNote" rows="4" placeholder="Delivery instructions or notes for the kitchen"></textarea></div></div><button class="submit-button" type="submit">Place order</button><p id="checkoutMessage" class="error-message"></p></form><aside class="order-summary"><span class="eyebrow">Your bag</span><h2>Order summary</h2><div id="checkoutItems"></div><div class="summary-total"><span>Subtotal</span><strong id="checkoutTotal">0 FCFA</strong></div><a class="arrow-link" href="menu.html">Add more dishes</a></aside></div></section><footer class="footer-bottom">© 2026 CAMUS · Secure checkout powered by Supabase.</footer><div id="checkoutForm"></div><div id="orderConfirmation"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/marketplace.js"></script><script src="js/geolocation.js"></script><script src="js/orders.js"></script><script src="js/checkout.js"></script></body></html>
