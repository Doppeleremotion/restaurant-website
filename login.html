<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | CAMUS</title><link rel="stylesheet" href="style.css"></head>
<body><main class="site-shell"><header class="site-header"><a class="brand" href="index.html"><img src="logo.svg" alt="CAMUS"><span>CAMUS</span></a><a class="login-button" href="index.html">Back to discover</a></header>
<section class="page-content"><div class="form-shell" style="max-width:480px"><span class="eyebrow">Welcome back</span><h2>Log in to CAMUS</h2><p class="muted">Track orders, save favorites, and manage reservations.</p><form id="loginForm"><div class="form-group"><label for="email">Email address</label><input id="email" type="email" required><span id="emailError" class="error-message"></span></div><div class="form-group"><label for="password">Password</label><input id="password" type="password" required><span id="passwordError" class="error-message"></span></div><label><input id="rememberMe" type="checkbox"> Remember me</label><p><button class="submit-button login-submit" type="submit">Log in</button></p><span id="generalError" class="error-message"></span></form><hr><h2>Create your account</h2><form id="signupForm"><div class="form-group"><label for="signupName">Full name</label><input id="signupName" required></div><div class="form-group"><label for="signupPhone">Phone number</label><input id="signupPhone" type="tel" required></div><div class="form-group"><label for="signupEmail">Email address</label><input id="signupEmail" type="email" required></div><div class="form-group"><label for="signupPassword">Password</label><input id="signupPassword" type="password" minlength="6" required></div><button class="submit-button" type="submit">Create account</button><span id="signupError" class="error-message"></span></form><p><a class="arrow-link" href="restaurant.html">Join as a restaurant instead</a></p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script></body></html>
