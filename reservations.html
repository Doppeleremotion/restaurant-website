<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservations | CAMUS</title><link rel="stylesheet" href="style.css"></head><body><main class="site-shell"><header class="site-header"><a class="brand" href="index.html"><img src="logo.svg" alt="CAMUS"><span>CAMUS</span></a><button class="mobile-menu" id="menuButton">☰</button><nav class="main-nav" id="mainNav"><a href="index.html">Discover</a><a href="menu.html">Dishes</a><a class="active" href="reservations.html">Reservations</a><a href="about.html">About CAMUS</a><a href="restaurant.html">For restaurants</a></nav><div class="header-actions"><a class="login-button" href="login.html">Log in</a></div></header><section class="page-hero"><span class="eyebrow">Make it a moment</span><h1>Reserve your<br><em>favorite table.</em></h1><p>Choose a restaurant, pick a time, and let the kitchen know you are coming.</p></section><section class="page-content"><div class="form-shell"><h2>Reservation details</h2><form id="reservationForm"><div class="form-grid"><div class="form-group"><label for="restaurant">Restaurant</label><select id="restaurant" required><option value="">Choose a restaurant</option><option>Camus Kitchen</option><option>La Terrasse</option><option>Yaoundé Grill</option></select></div><div class="form-group"><label for="guests">Guests</label><select id="guests" required><option value="">Party size</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option></select></div><div class="form-group"><label for="date">Date</label><input id="date" type="date" required></div><div class="form-group"><label for="time">Time</label><input id="time" type="time" required></div><div class="form-group"><label for="firstName">Your name</label><input id="firstName" required></div><div class="form-group"><label for="phone">Phone number</label><input id="phone" type="tel" required></div><div class="form-group full"><label for="email">Email</label><input id="email" type="email" required></div><div class="form-group full"><label for="notes">Note for the restaurant</label><textarea id="notes" rows="4" placeholder="Birthday, accessibility needs, or anything else..."></textarea></div><div class="form-group full"><button class="submit-button" type="submit">Request reservation</button></div></div></form></div></section><footer class="footer-bottom">© 2026 CAMUS · Reservations are confirmed by the restaurant.</footer></main><script src="js/app.js"></script></body></html>
