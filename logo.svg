<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#faf8f3" stroke="#886522" stroke-width="2"/>
  
  <!-- Decorative outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#b8860b" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Plate circle -->
  <circle cx="100" cy="105" r="65" fill="none" stroke="#886522" stroke-width="3"/>
  <circle cx="100" cy="105" r="60" fill="#fff9e6" stroke="#b8860b" stroke-width="1"/>
  
  <!-- Fork on left -->
  <g transform="translate(50, 95)">
    <!-- Fork handle -->
    <rect x="0" y="8" width="3" height="35" fill="#b8860b" rx="1.5"/>
    <!-- Fork prongs -->
    <rect x="-8" y="-8" width="2.5" height="16" fill="#b8860b" rx="1"/>
    <rect x="3" y="-8" width="2.5" height="16" fill="#b8860b" rx="1"/>
    <rect x="13" y="-8" width="2.5" height="16" fill="#b8860b" rx="1"/>
    <!-- Fork neck -->
    <path d="M -8 8 L -6 8 L 15 8 L 16 8" stroke="#b8860b" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Spoon on right -->
  <g transform="translate(115, 95) scale(-1, 1)">
    <!-- Spoon handle -->
    <rect x="0" y="8" width="3" height="35" fill="#886522" rx="1.5"/>
    <!-- Spoon bowl -->
    <ellipse cx="6" cy="-5" rx="8" ry="13" fill="#886522" opacity="0.8"/>
    <ellipse cx="6" cy="-4" rx="6" ry="10" fill="#b8860b"/>
  </g>
  
  <!-- Central food element - stylized pot/bowl with food -->
  <g transform="translate(100, 110)">
    <!-- Pot body -->
    <ellipse cx="0" cy="0" rx="28" ry="24" fill="#e8d4c0" stroke="#886522" stroke-width="1.5"/>
    <!-- Pot rim -->
    <ellipse cx="0" cy="-22" rx="30" ry="6" fill="#c9a566" stroke="#886522" stroke-width="1"/>
    <!-- Pot handles -->
    <path d="M -28 -8 Q -38 0 -28 8" stroke="#c9a566" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 28 -8 Q 38 0 28 8" stroke="#c9a566" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Food inside - rice/grains -->
    <ellipse cx="-8" cy="-2" rx="5" ry="6" fill="#f4a460" opacity="0.8"/>
    <ellipse cx="8" cy="2" rx="6" ry="5" fill="#d4a574" opacity="0.8"/>
    <circle cx="0" cy="-5" r="3.5" fill="#f4a460" opacity="0.7"/>
    <circle cx="-5" cy="5" r="3" fill="#d4a574" opacity="0.7"/>
    <circle cx="6" cy="6" r="2.5" fill="#f4a460" opacity="0.6"/>
    
    <!-- Garnish - leaf -->
    <path d="M -3 -12 Q -8 -8 -6 -2" stroke="#7cb342" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 3 -12 Q 8 -8 6 -2" stroke="#9ccc65" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative elements - small circles/dots -->
  <circle cx="70" cy="65" r="2.5" fill="#b8860b" opacity="0.6"/>
  <circle cx="130" cy="65" r="2.5" fill="#b8860b" opacity="0.6"/>
  <circle cx="65" cy="145" r="2.5" fill="#b8860b" opacity="0.6"/>
  <circle cx="135" cy="145" r="2.5" fill="#b8860b" opacity="0.6"/>
  
  <!-- Top arc accent -->
  <path d="M 70 35 Q 100 25 130 35" stroke="#b8860b" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Bottom arc accent -->
  <path d="M 70 175 Q 100 185 130 175" stroke="#b8860b" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
